<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picture mix comparison</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#171d21;color:#ecf1e9}
main{max-width:940px;margin:4vh auto;padding:0 16px}h1{font-size:1.4rem}video{display:block;width:100%;border-radius:12px;background:#101417}
.controls{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0}button{font:inherit;color:inherit;background:#303a3f;border:1px solid #5b686e;border-radius:8px;padding:.5rem .9rem;cursor:pointer}button[aria-pressed="true"]{background:#c1dac7;color:#17291d}input{min-width:130px;flex:1}
</style>
<main><h1>Picture mix comparison</h1><video id="picture" playsinline preload="auto"></video><video id="other" playsinline preload="auto" hidden style="display:none"></video>
<div class="controls"><button id="play">Play</button><input id="seek" type="range" min="0" max="1" step=".01" value="0" aria-label="Picture time">
<button id="a" aria-pressed="true">Mix A</button><button id="b" aria-pressed="false">Mix B</button><button id="reveal">Reveal mixes</button></div><output id="status" aria-live="polite"></output></main>
<script type="application/json" id="files"><!--MIXES--></script>
<script>
const $=id=>document.getElementById(id), files=JSON.parse($('files').textContent), tracks=[$('picture'),$('other')];
if(crypto.getRandomValues(new Uint8Array(1))[0]%2)files.reverse();
let current=0,operation=0;
function display(i){tracks.forEach((v,k)=>{v.style.display=k===i?'block':'none';v.hidden=k!==i;v.muted=k!==i;});$('a').setAttribute('aria-pressed',String(i===0));$('b').setAttribute('aria-pressed',String(i===1));}
tracks.forEach((v,k)=>{
 v.src=files[k];v.addEventListener('loadedmetadata',()=>{$('seek').max=v.duration;});
 v.addEventListener('timeupdate',()=>{if(k===current)$('seek').value=v.currentTime;});
 v.addEventListener('play',()=>{if(k===current)$('play').textContent='Pause';});
 v.addEventListener('pause',()=>{if(k===current)$('play').textContent='Play';});
 v.addEventListener('error',()=>{$('status').textContent='Keep both movie files at their original paths.';});
});
display(0);
async function select(i){
 if(i===current)return;
 const old=tracks[current],wasPlaying=!old.paused,time=old.currentTime;old.pause();
 const token=++operation;current=i;const v=tracks[i];display(i);
 if(Math.abs(v.currentTime-time)>.005){v.currentTime=time;if(v.seeking)await new Promise(ok=>v.addEventListener('seeked',ok,{once:true}));}
 if(token===operation&&wasPlaying)await v.play();
}
$('play').onclick=()=>{operation++;const v=tracks[current];if(v.paused)v.play();else v.pause();};
$('seek').oninput=e=>{tracks[current].currentTime=Number(e.target.value);};
$('a').onclick=()=>select(0);$('b').onclick=()=>select(1);
$('reveal').onclick=()=>{$('status').textContent=files.map((x,i)=>'Mix '+(i?'B':'A')+' · '+decodeURIComponent(x.split('/').pop())).join('     ');};
</script></html>
